  <rect width="1600" height="560" rx="34" fill="url(#bg)"/>
  <circle cx="1260" cy="90" r="170" fill="#5f4bdb" opacity=".18" filter="url(#glow)"/>
  <circle cx="250" cy="480" r="190" fill="#1ab4df" opacity=".13" filter="url(#glow)"/>
  <g opacity=".2" stroke="#72dfff"><path d="M0 112h1600M0 224h1600M0 336h1600M0 448h1600"/><path d="M200 0v560M400 0v560M600 0v560M800 0v560M1000 0v560M1200 0v560M1400 0v560"/></g>
